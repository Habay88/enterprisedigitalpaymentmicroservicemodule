# application.properties - Main configuration file

# ===================================
# SERVER CONFIGURATION
# ===================================
server.port=8081
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-binding-errors=always
server.shutdown=graceful
server.tomcat.connection-timeout=5s
server.tomcat.max-threads=200
server.tomcat.max-connections=10000

# ===================================
# SPRING BOOT CONFIGURATION
# ===================================
spring.application.name=identity-service
spring.profiles.active=dev
spring.output.ansi.enabled=ALWAYS

# ===================================
# DATABASE CONFIGURATION (PostgreSQL)
# ===================================
spring.datasource.url=jdbc:postgresql://localhost:5432/identity_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===================================
# JPA / HIBERNATE CONFIGURATION
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===================================
# LOGGING CONFIGURATION
# ===================================
logging.level.com.paymentplatform=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/identity-service.log
logging.file.max-size=10MB
logging.file.max-history=7

# ===================================
# SWAGGER / OPENAPI CONFIGURATION
# ===================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.show-actuator=true
springdoc.packages-to-scan=com.paymentplatform.identity.controller

# ===================================
# SECURITY CONFIGURATION (for testing - disable in production)
# ===================================
spring.security.enabled=false
management.security.enabled=false

# ===================================
# MULTITENANCY CONFIGURATION
# ===================================
multitenancy.enabled=true
multitenancy.default-tenant=public

# ===================================
# FRAUD DETECTION CONFIGURATION
# ===================================
fraud.max-login-attempts=5
fraud.lockout-minutes=30
fraud.max-transactions-per-hour=10
fraud.suspicious-countries=RU,NG,UA,PK

# ===================================
# AUDIT CONFIGURATION
# ===================================
audit.enabled=true
audit.kafka.topic=audit-events
audit.kafka.bootstrap-servers=localhost:9092

# ===================================
# CACHE CONFIGURATION
# ===================================
spring.cache.type=simple
spring.cache.cache-names=customers,tenants

# ===================================
# ACTUATOR CONFIGURATION
# ===================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.defaults.enabled=true

# ===================================
# JACKSON CONFIGURATION
# ===================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null