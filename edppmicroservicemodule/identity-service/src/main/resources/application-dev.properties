# Enhanced application-dev.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/identity_dev
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# JPA Settings
spring.jpa.hibernate.ddl-auto=create-drop  # Changed to create-drop for fresh data each time
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.com.paymentplatform=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Swagger
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Security (disabled for testing)
spring.security.enabled=false

# CORS for testing
cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://localhost:8081
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true

# Server
server.port=8081
server.servlet.context-path=/api

# Multitenancy
multitenancy.enabled=true
multitenancy.default-tenant=FIRST_BANK

# Audit (disabled for testing to avoid Kafka dependency)
audit.enabled=false

# Fraud Detection
fraud.max-login-attempts=5
fraud.lockout-minutes=30
fraud.max-transactions-per-hour=10