# docker-compose.yml
version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: identity-postgres
    environment:
      POSTGRES_DB: identity_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - identity-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: identity-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@paymentplatform.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - identity-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: identity-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - identity-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: identity-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - identity-network

  redis:
    image: redis:7-alpine
    container_name: identity-redis
    ports:
      - "6379:6379"
    networks:
      - identity-network

networks:
  identity-network:
    driver: bridge

volumes:
  postgres_data: