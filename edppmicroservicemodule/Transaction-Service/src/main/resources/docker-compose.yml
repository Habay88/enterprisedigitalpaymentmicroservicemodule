version: '3.8'

services:
  transaction-postgres:
    image: postgres:15
    container_name: transaction-postgres
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - transaction-postgres-data:/var/lib/postgresql/data
    networks:
      - payment-network

  transaction-redis:
    image: redis:7-alpine
    container_name: transaction-redis
    ports:
      - "6379:6379"
    networks:
      - payment-network

  transaction-service:
    build: .
    container_name: transaction-service
    depends_on:
      - transaction-postgres
      - transaction-redis
      - kafka
    environment:
      DB_URL: jdbc:postgresql://transaction-postgres:5432/transaction_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: transaction-redis
      REDIS_PORT: 6379
      KAFKA_SERVERS: kafka:9092
      EUREKA_URI: http://discovery-service:8761/eureka
    ports:
      - "8082:8082"
    networks:
      - payment-network

networks:
  payment-network:
    external: true

volumes:
  transaction-postgres-data: