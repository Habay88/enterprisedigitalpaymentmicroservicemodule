spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/transaction_db
    username: postgres
    password: postgres
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
  redis:
    host: localhost
    port: 6379

server:
  port: 8082

eureka:
  client:
    enabled: false

logging:
  level:
    com.edpp.transaction: DEBUG
    org.springframework.web: DEBUG

app:
  environment: development